name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The repo pins .python-version (3.12). Without this, `uv run` would discard the
      # matrix interpreter's environment and silently rebuild it on 3.12 without extras.
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Show interpreter
        run: uv run python --version

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy contextbridge

      - name: Test (unit + end-to-end)
        run: uv run pytest -q
