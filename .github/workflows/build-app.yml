name: Build app

# Builds the standalone desktop app. Run it by hand from the Actions tab, or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build and check the app
        run: uv run python scripts/build_app.py

      - name: Zip the app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ContextBridge.app ContextBridge-macOS.zip

      - name: Zip the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ContextBridge -DestinationPath ContextBridge-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ContextBridge-${{ runner.os }}
          path: ContextBridge-*.zip
          if-no-files-found: error
